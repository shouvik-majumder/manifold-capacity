[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mancap"
version = "0.1.0"
description = "Manifold capacity by replica mean-field theory: reimplemented, batched, validated"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
]

[project.optional-dependencies]
sim = ["scikit-learn>=1.3"]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["mancap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: direct-simulation validations; minutes, not seconds",
]
